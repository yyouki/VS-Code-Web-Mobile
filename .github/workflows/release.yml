name: Release APK

on:
  push:
    tags:
      - "v*"
  create:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.5.4"
        required: true
        default: "0.5.4"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'create' || (github.ref_type == 'branch' && startsWith(github.ref_name, 'release/'))
    name: Build and publish release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            TAG="$REF_NAME"
            VERSION="${TAG#v}"
          elif [[ "$REF_NAME" == release/* ]]; then
            VERSION="${REF_NAME#release/}"
            TAG="v$VERSION"
          else
            VERSION="$INPUT_VERSION"
            TAG="$VERSION"
            [[ "$TAG" == v* ]] || TAG="v$TAG"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Configure release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release-keystore.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "Persistent signing secrets are not configured; using the temporary debug key."
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build release APK
        run: gradle --no-daemon -PappVersion="${{ steps.version.outputs.version }}" :app:assembleRelease

      - name: Rename APK
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/CodeWebCompanion-$TAG.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Code Web Companion ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.signing.outputs.prerelease }}
          generate_release_notes: true
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
